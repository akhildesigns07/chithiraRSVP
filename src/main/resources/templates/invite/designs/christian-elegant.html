<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* Christian Elegant: ivory card, fine double gold rule, floral vines in each corner, a quiet cross. */-->
<main th:fragment="card" class="card">
    <div th:replace="~{invite/parts :: frame}"></div>

    <svg width="0" height="0" class="defs" aria-hidden="true">
        <symbol id="ce-corner" viewBox="0 0 100 100">
            <path class="draw" pathLength="1" d="M6 94C6 46 46 6 94 6" fill="none" stroke="currentColor" stroke-width="1.4"/>
            <path class="draw" pathLength="1" d="M16 70c6-14 16-22 30-24M30 40c10-4 20-2 28 6M70 16c-2 10-8 18-18 22" fill="none" stroke="currentColor" stroke-width="1.1"/>
            <g class="bloom" fill="currentColor">
                <path d="M46 46c4-8 12-10 16-6-4 6-10 8-16 6z"/>
                <path d="M16 70c-6-6-6-14-2-18 4 6 4 12 2 18z"/>
                <path d="M70 16c6 6 14 6 18 2-6-4-12-4-18-2z"/>
                <path d="M30 40c-8-2-12-8-10-12 6 2 10 6 10 12z"/>
                <circle cx="22" cy="22" r="4.5"/><circle cx="22" cy="13" r="2.6"/><circle cx="13" cy="22" r="2.6"/>
                <circle cx="29" cy="16" r="2.2"/><circle cx="16" cy="29" r="2.2"/>
            </g>
        </symbol>
    </svg>
    <svg class="corner c-tl" aria-hidden="true"><use href="#ce-corner"/></svg>
    <svg class="corner c-tr" aria-hidden="true"><use href="#ce-corner"/></svg>
    <svg class="corner c-bl" aria-hidden="true"><use href="#ce-corner"/></svg>
    <svg class="corner c-br" aria-hidden="true"><use href="#ce-corner"/></svg>

    <svg class="motif cross" viewBox="0 0 60 80" width="38" height="51" role="img" aria-label="Cross">
        <circle cx="30" cy="27" r="22" fill="currentColor" opacity=".08"/>
        <path class="draw" pathLength="1" d="M30 4v72M14 24h32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    </svg>

    <p th:replace="~{invite/parts :: greeting}"></p>
    <div th:replace="~{invite/parts :: names}"></div>

    <svg class="divider stage s-details" viewBox="0 0 240 20" width="200" height="16" aria-hidden="true">
        <path d="M8 10c30 0 50-8 80-2 10 2 18 6 32 6s22-4 32-6c30-6 50 2 80 2" fill="none" stroke="currentColor" stroke-width="1.1"/>
        <circle cx="120" cy="12" r="3" fill="currentColor"/>
    </svg>

    <div th:replace="~{invite/parts :: event-details}"></div>
    <div th:replace="~{invite/parts :: respond}"></div>
</main>
</body>
</html>
