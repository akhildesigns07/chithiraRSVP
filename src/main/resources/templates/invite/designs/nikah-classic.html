<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* Nikah Classic: emerald with a gold eight-point-star lattice, a pointed arch crowning the card, an arcade divider. */-->
<main th:fragment="card" class="card">
    <svg class="lattice" aria-hidden="true">
        <defs>
            <pattern id="nc-lattice" width="48" height="48" patternUnits="userSpaceOnUse">
                <g fill="none" stroke="currentColor" stroke-width="1">
                    <rect x="12" y="12" width="24" height="24"/>
                    <rect x="12" y="12" width="24" height="24" transform="rotate(45 24 24)"/>
                    <path d="M0 0l12 12M48 0L36 12M0 48l12-12M48 48L36 36"/>
                </g>
            </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#nc-lattice)"/>
    </svg>

    <div th:replace="~{invite/parts :: frame}"></div>

    <svg class="motif arch" viewBox="0 0 200 150" width="176" height="132" aria-hidden="true">
        <path class="draw" pathLength="1" d="M20 150V92C20 52 60 34 100 4c40 30 80 48 80 88v58" fill="none" stroke="currentColor" stroke-width="2"/>
        <path class="draw" pathLength="1" d="M34 150V96c0-32 34-48 66-74 32 26 66 42 66 74v54" fill="none" stroke="currentColor" stroke-width="1"/>
        <g class="bloom" transform="translate(100 88)" fill="none" stroke="currentColor" stroke-width="1.3">
            <rect x="-17" y="-17" width="34" height="34"/>
            <rect x="-17" y="-17" width="34" height="34" transform="rotate(45)"/>
            <circle r="8"/>
            <circle r="2.5" fill="currentColor"/>
        </g>
    </svg>

    <p th:replace="~{invite/parts :: greeting}"></p>
    <div th:replace="~{invite/parts :: names}"></div>

    <svg class="divider stage s-details" viewBox="0 0 240 24" width="210" height="21" aria-hidden="true">
        <path d="M0 22h240M12 22v-8a12 12 0 0124 0v8M48 22v-8a12 12 0 0124 0v8M84 22v-8a12 12 0 0124 0v8M132 22v-8a12 12 0 0124 0v8M168 22v-8a12 12 0 0124 0v8M204 22v-8a12 12 0 0124 0v8"
              fill="none" stroke="currentColor" stroke-width="1.1"/>
        <path d="M120 2l6 8-6 8-6-8z" fill="currentColor"/>
    </svg>

    <div th:replace="~{invite/parts :: event-details}"></div>
    <div th:replace="~{invite/parts :: respond}"></div>
</main>
</body>
</html>
