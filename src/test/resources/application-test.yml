spring:
  datasource:
    url: jdbc:h2:mem:rsvp;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  thymeleaf:
    cache: false

app:
  base-url: https://invite.test
  admin:
    username: admin
    password: secret
  # High so RSVP tests in a shared context aren't throttled; RsvpRateLimitTest sets its own limit.
  rate-limit:
    rsvp-per-minute: 1000
